<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحليلات | أجر لا ينقطع</title>
    <meta name="description" content="لوحة تحليلات المنتج — أجر لا ينقطع">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/admin.css?v=20260521">
</head>

<body>
    <main class="analytics-page">
        <div class="analytics-header">
            <div>
                <h1 class="analytics-title">📊 لوحة التحليلات</h1>
                <a href="/admin" class="back-link">← العودة للوحة الإدارة</a>
            </div>
            <div class="period-selector">
                <button class="period-btn" data-period="7d">٧ أيام</button>
                <button class="period-btn active" data-period="30d">٣٠ يوم</button>
                <button class="period-btn" data-period="90d">٩٠ يوم</button>
            </div>
        </div>

        <div id="analyticsLoading" class="loading">جارٍ تحميل التحليلات...</div>
        <div id="analyticsContent" hidden>
            <!-- Overview Stats -->
            <div class="stats-grid" id="overviewStats"></div>

            <!-- Daily Trend -->
            <div class="section">
                <h2 class="section-title">📈 الاتجاه اليومي</h2>
                <div id="dailyTrend" class="bar-chart"></div>
            </div>

            <!-- Traffic Sources -->
            <div class="section">
                <h2 class="section-title">🔗 مصادر الزيارات</h2>
                <div id="trafficSources" class="bar-chart"></div>
            </div>

            <!-- Top Pages -->
            <div class="section">
                <h2 class="section-title">📄 أكثر الصفحات زيارة</h2>
                <table class="data-table">
                    <thead><tr><th>الصفحة</th><th>العنوان</th><th>المشاهدات</th></tr></thead>
                    <tbody id="topPages"></tbody>
                </table>
            </div>

            <!-- Devices -->
            <div class="section">
                <h2 class="section-title">📱 الأجهزة والمتصفحات</h2>
                <div id="devices"></div>
            </div>

            <!-- Geography -->
            <div class="section">
                <h2 class="section-title">🌍 الدول</h2>
                <div id="geography" class="bar-chart"></div>
            </div>

            <!-- Funnels -->
            <div class="section">
                <h2 class="section-title">🎯 مسارات التحويل</h2>
                <div id="funnels" class="funnel"></div>
            </div>

            <!-- Retention -->
            <div class="section">
                <h2 class="section-title">🔄 الاحتفاظ</h2>
                <div id="retention"></div>
            </div>
        </div>
    </main>

    <script src="lib/analytics.js?v=20260521"></script>
    <script src="lib/analytics-dashboard.js?v=20260521"></script>
</body>

</html>
