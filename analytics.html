<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحليلات | أجر لا ينقطع</title>
    <meta name="description" content="لوحة تحليلات المنتج — أجر لا ينقطع">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/admin.css">
    <style>
        .analytics-page { padding: var(--space-xl); max-width: 1200px; margin: 0 auto; }
        .analytics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); flex-wrap: wrap; gap: var(--space-md); }
        .analytics-title { font-size: var(--font-size-2xl); font-weight: 700; }
        .period-selector { display: flex; gap: var(--space-xs); }
        .period-btn { padding: var(--space-xs) var(--space-md); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer; font-family: var(--font-primary); font-size: var(--font-size-sm); }
        .period-btn.active { background: var(--color-accent); color: white; border-color: var(--color-accent); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-lg); margin-bottom: var(--space-xl); }
        .stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-lg); text-align: center; }
        .stat-value { font-size: var(--font-size-3xl); font-weight: 700; color: var(--color-accent); }
        .stat-label { font-size: var(--font-size-sm); color: var(--color-text-muted); margin-top: var(--space-xs); }
        .section { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }
        .section-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--space-md); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: var(--space-sm) var(--space-md); text-align: right; border-bottom: 1px solid var(--color-border); font-size: var(--font-size-sm); }
        .data-table th { font-weight: 600; color: var(--color-text-muted); }
        .bar-chart { display: flex; flex-direction: column; gap: var(--space-xs); }
        .bar-row { display: flex; align-items: center; gap: var(--space-sm); }
        .bar-label { min-width: 120px; font-size: var(--font-size-sm); text-align: right; }
        .bar-track { flex: 1; height: 24px; background: var(--color-border); border-radius: var(--radius-sm); overflow: hidden; }
        .bar-fill { height: 100%; background: var(--color-accent); border-radius: var(--radius-sm); transition: width 0.3s ease; }
        .bar-value { min-width: 50px; font-size: var(--font-size-sm); font-weight: 600; }
        .funnel { display: flex; flex-direction: column; gap: var(--space-sm); }
        .funnel-step { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md); background: rgba(140,106,53,0.05); border-radius: var(--radius-md); }
        .funnel-step-name { flex: 1; font-weight: 500; }
        .funnel-step-count { font-weight: 700; color: var(--color-accent); }
        .funnel-step-rate { font-size: var(--font-size-sm); color: var(--color-text-muted); }
        .loading { text-align: center; padding: var(--space-3xl); color: var(--color-text-muted); }
        .empty { text-align: center; padding: var(--space-3xl); color: var(--color-text-muted); }
        .back-link { color: var(--color-accent); text-decoration: none; font-size: var(--font-size-sm); }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <main class="analytics-page">
        <div class="analytics-header">
            <div>
                <h1 class="analytics-title">📊 لوحة التحليلات</h1>
                <a href="/admin" class="back-link">← العودة للوحة الإدارة</a>
            </div>
            <div class="period-selector">
                <button class="period-btn" data-period="7d">٧ أيام</button>
                <button class="period-btn active" data-period="7d">٣٠ يوم</button>
                <button class="period-btn" data-period="90d">٩٠ يوم</button>
            </div>
        </div>

        <div id="analyticsLoading" class="loading">جارٍ تحميل التحليلات...</div>
        <div id="analyticsContent" hidden>
            <!-- Overview Stats -->
            <div class="stats-grid" id="overviewStats"></div>

            <!-- Daily Trend -->
            <div class="section">
                <h2 class="section-title">📈 الاتجاه اليومي</h2>
                <div id="dailyTrend" class="bar-chart"></div>
            </div>

            <!-- Traffic Sources -->
            <div class="section">
                <h2 class="section-title">🔗 مصادر الزيارات</h2>
                <div id="trafficSources" class="bar-chart"></div>
            </div>

            <!-- Top Pages -->
            <div class="section">
                <h2 class="section-title">📄 أكثر الصفحات زيارة</h2>
                <table class="data-table">
                    <thead><tr><th>الصفحة</th><th>العنوان</th><th>المشاهدات</th></tr></thead>
                    <tbody id="topPages"></tbody>
                </table>
            </div>

            <!-- Devices -->
            <div class="section">
                <h2 class="section-title">📱 الأجهزة والمتصفحات</h2>
                <div id="devices"></div>
            </div>

            <!-- Geography -->
            <div class="section">
                <h2 class="section-title">🌍 الدول</h2>
                <div id="geography" class="bar-chart"></div>
            </div>

            <!-- Funnels -->
            <div class="section">
                <h2 class="section-title">🎯 مسارات التحويل</h2>
                <div id="funnels" class="funnel"></div>
            </div>

            <!-- Retention -->
            <div class="section">
                <h2 class="section-title">🔄 الاحتفاظ</h2>
                <div id="retention"></div>
            </div>
        </div>
    </main>

    <script src="lib/analytics.js?v=20260521"></script>
    <script>
        (function () {
            'use strict';

            const API_BASE = window.location.origin;
            let currentPeriod = '30d';

            // Period selector
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPeriod = btn.dataset.period;
                    loadAnalytics();
                });
            });

            async function loadAnalytics() {
                const loading = document.getElementById('analyticsLoading');
                const content = document.getElementById('analyticsContent');
                loading.hidden = false;
                content.hidden = true;

                try {
                    const response = await fetch(`${API_BASE}/api/analytics/dashboard?period=${currentPeriod}`, {
                        headers: { 'X-Admin-Key': getAdminKey() },
                    });

                    if (!response.ok) throw new Error('Failed to load analytics');

                    const result = await response.json();
                    if (!result.success) throw new Error(result.message);

                    renderDashboard(result.data);
                    loading.hidden = true;
                    content.hidden = false;
                } catch (err) {
                    loading.textContent = 'فشل تحميل التحليلات. تأكد من تسجيل الدخول.';
                }
            }

            function getAdminKey() {
                return sessionStorage.getItem('adminKey') || '';
            }

            function renderDashboard(data) {
                renderOverview(data.overview);
                renderDailyTrend(data.overview.daily_trend);
                renderTrafficSources(data.traffic_sources);
                renderTopPages(data.top_pages);
                renderDevices(data.devices);
                renderGeography(data.geography);
                renderFunnels(data.funnels);
                renderRetention(data.retention);
            }

            function renderOverview(overview) {
                const container = document.getElementById('overviewStats');
                const stats = [
                    { label: 'مشاهدات الصفحة', value: overview.page_views },
                    { label: 'زوار فريدون', value: overview.unique_visitors },
                    { label: 'زوار عائدين', value: overview.returning_visitors },
                    { label: 'إجمالي الأحداث', value: overview.total_events },
                    { label: 'أحداث/جلسة', value: overview.avg_events_per_session },
                ];
                container.innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <div class="stat-value">${s.value.toLocaleString('ar-EG')}</div>
                        <div class="stat-label">${s.label}</div>
                    </div>
                `).join('');
            }

            function renderDailyTrend(trend) {
                const container = document.getElementById('dailyTrend');
                if (!trend || trend.length === 0) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                const maxViews = Math.max(...trend.map(d => d.views), 1);
                container.innerHTML = trend.slice(-14).map(d => `
                    <div class="bar-row">
                        <span class="bar-label">${d.date}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${(d.views / maxViews * 100).toFixed(1)}%"></div></div>
                        <span class="bar-value">${d.views}</span>
                    </div>
                `).join('');
            }

            function renderTrafficSources(sources) {
                const container = document.getElementById('trafficSources');
                if (!sources || sources.length === 0) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                const maxCount = Math.max(...sources.map(s => s.count), 1);
                container.innerHTML = sources.slice(0, 10).map(s => `
                    <div class="bar-row">
                        <span class="bar-label">${s.source}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${(s.count / maxCount * 100).toFixed(1)}%"></div></div>
                        <span class="bar-value">${s.count}</span>
                    </div>
                `).join('');
            }

            function renderTopPages(pages) {
                const container = document.getElementById('topPages');
                if (!pages || pages.length === 0) {
                    container.innerHTML = '<tr><td colspan="3" class="empty">لا توجد بيانات بعد</td></tr>';
                    return;
                }
                container.innerHTML = pages.slice(0, 10).map(p => `
                    <tr>
                        <td style="direction:ltr;text-align:left;font-size:0.8rem;">${p.path}</td>
                        <td>${p.title || '—'}</td>
                        <td>${p.views.toLocaleString('ar-EG')}</td>
                    </tr>
                `).join('');
            }

            function renderDevices(devices) {
                const container = document.getElementById('devices');
                if (!devices || !devices.devices) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                const maxCount = Math.max(
                    ...(devices.devices.map(d => d.count)),
                    ...(devices.browsers.map(d => d.count)),
                    1
                );
                container.innerHTML = `
                    <h3 style="margin:var(--space-md) 0 var(--space-sm);font-size:var(--font-size-md);">الأجهزة</h3>
                    ${renderBarList(devices.devices, maxCount)}
                    <h3 style="margin:var(--space-lg) 0 var(--space-sm);font-size:var(--font-size-md);">المتصفحات</h3>
                    ${renderBarList(devices.browsers, maxCount)}
                `;
            }

            function renderBarList(items, maxCount) {
                if (!items || items.length === 0) return '<p class="empty">—</p>';
                return items.slice(0, 8).map(d => `
                    <div class="bar-row">
                        <span class="bar-label">${d.name}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${(d.count / maxCount * 100).toFixed(1)}%"></div></div>
                        <span class="bar-value">${d.count}</span>
                    </div>
                `).join('');
            }

            function renderGeography(countries) {
                const container = document.getElementById('geography');
                if (!countries || countries.length === 0) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                const maxCount = Math.max(...countries.map(c => c.count), 1);
                container.innerHTML = countries.slice(0, 15).map(c => `
                    <div class="bar-row">
                        <span class="bar-label">${c.country}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${(c.count / maxCount * 100).toFixed(1)}%"></div></div>
                        <span class="bar-value">${c.count}</span>
                    </div>
                `).join('');
            }

            function renderFunnels(funnels) {
                const container = document.getElementById('funnels');
                if (!funnels) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                const l2i = funnels.landing_to_interaction || {};
                const l2s = funnels.landing_to_submission || {};
                const iRate = l2i.total > 0 ? Math.round(l2i.converted / l2i.total * 100) : 0;
                const sRate = l2s.total > 0 ? Math.round(l2s.converted / l2s.total * 100) : 0;

                container.innerHTML = `
                    <div class="funnel-step">
                        <span class="funnel-step-name">زيارة الصفحة الرئيسية</span>
                        <span class="funnel-step-count">${(l2i.total || 0).toLocaleString('ar-EG')}</span>
                        <span class="funnel-step-rate">100%</span>
                    </div>
                    <div class="funnel-step">
                        <span class="funnel-step-name">تفاعل مع الصفحة</span>
                        <span class="funnel-step-count">${(l2i.converted || 0).toLocaleString('ar-EG')}</span>
                        <span class="funnel-step-rate">${iRate}%</span>
                    </div>
                    <div class="funnel-step">
                        <span class="funnel-step-name">إرسال مشاركة</span>
                        <span class="funnel-step-count">${(l2s.converted || 0).toLocaleString('ar-EG')}</span>
                        <span class="funnel-step-rate">${sRate}%</span>
                    </div>
                `;
            }

            function renderRetention(retention) {
                const container = document.getElementById('retention');
                if (!retention) {
                    container.innerHTML = '<p class="empty">لا توجد بيانات بعد</p>';
                    return;
                }
                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${retention.returning_rate || 0}%</div>
                            <div class="stat-label">نسبة الزوار العائدين</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(retention.repeat_sessions || 0).toLocaleString('ar-EG')}</div>
                            <div class="stat-label">جلسات عائدين</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(retention.total_sessions || 0).toLocaleString('ar-EG')}</div>
                            <div class="stat-label">إجمالي الجلسات</div>
                        </div>
                    </div>
                `;
            }

            // Load on init
            loadAnalytics();
        })();
    </script>
</body>

</html>
