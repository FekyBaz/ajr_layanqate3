<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Text Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="quiet-text-story" data-composition-id="quiet-text-story" data-start="0" data-duration="17.5" data-width="1080" data-height="1920">
    <div class="scene">
      <div class="grain"></div>
      <div class="scene-content">
        <div class="text-stage">
          <div class="line-wrap line-wrap--1">
            <p class="line line--1" id="line-1"></p>
            <span class="cursor cursor--1" id="cursor-1"></span>
          </div>

          <div class="line-wrap line-wrap--2">
            <p class="line line--2" id="line-2"></p>
            <span class="cursor cursor--2" id="cursor-2"></span>
          </div>

          <div class="line-wrap line-wrap--3">
            <p class="line line--3" id="line-3"></p>
          </div>

          <div class="line-wrap line-wrap--4">
            <p class="line line--4" id="line-4"></p>
          </div>
        </div>

        <div class="ui-glimpse" id="ui-glimpse">
          <div class="ui-card">
            <p class="ui-header">مسبحتك الرقمية</p>
            <div class="ui-pill">سبحان الله</div>
            <div class="ui-circle">
              <span class="ui-count">1</span>
            </div>
            <p class="ui-helper">بدون مزامنة، بدون تتبع</p>
          </div>
        </div>

        <div class="final-wrap">
          <p class="final-line" id="final-line"></p>
          <span class="cursor cursor--final" id="cursor-final"></span>
        </div>
      </div>
    </div>

    <style>
      :root {
        --bg: #f6f0e4;
        --bg-soft: #fbf7ef;
        --text: #2f261b;
        --text-secondary: #5c4d3b;
        --muted: #8b7961;
        --accent: #8c6a35;
        --border: #d6c6ab;
        --display: "Cairo", sans-serif;
        --body: "Noto Naskh Arabic", serif;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      #quiet-text-story {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.6), transparent 24%),
          radial-gradient(circle at 78% 8%, rgba(200, 166, 115, 0.08), transparent 24%),
          linear-gradient(180deg, #fbf7ef 0%, #f5eee2 52%, #f1e8d9 100%);
        color: var(--text);
      }

      .scene, .scene-content {
        width: 100%;
        height: 100%;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 180px 110px;
        box-sizing: border-box;
        gap: 42px;
        position: relative;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        background-image:
          radial-gradient(circle at 20% 20%, rgba(47, 38, 27, 0.5) 0 0.6px, transparent 0.7px),
          radial-gradient(circle at 70% 40%, rgba(47, 38, 27, 0.4) 0 0.6px, transparent 0.7px),
          radial-gradient(circle at 40% 70%, rgba(47, 38, 27, 0.3) 0 0.6px, transparent 0.7px);
        background-size: 18px 18px, 22px 22px, 20px 20px;
      }

      .text-stage {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .line-wrap,
      .final-wrap {
        position: relative;
        min-height: 92px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .line,
      .final-line {
        margin: 0;
        font-family: var(--display);
        color: var(--text);
        letter-spacing: 0;
      }

      .line--1,
      .line--2,
      .final-line {
        font-size: 72px;
        line-height: 1.4;
        font-weight: 600;
      }

      .line--3,
      .line--4 {
        font-size: 46px;
        line-height: 1.4;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .cursor {
        width: 3px;
        height: 54px;
        background: rgba(92, 77, 59, 0.75);
        border-radius: 999px;
        display: inline-block;
        margin-right: 10px;
        opacity: 0;
      }

      .cursor--final {
        height: 56px;
      }

      .ui-glimpse {
        width: 100%;
        display: flex;
        justify-content: center;
        opacity: 0;
      }

      .ui-card {
        width: 100%;
        max-width: 560px;
        background: rgba(255, 250, 241, 0.86);
        border: 1px solid rgba(214, 198, 171, 0.82);
        border-radius: 32px;
        padding: 34px 28px 30px;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 8px 24px rgba(77, 55, 26, 0.05);
      }

      .ui-header,
      .ui-helper {
        margin: 0;
        font-family: var(--body);
      }

      .ui-header {
        color: var(--muted);
        font-size: 28px;
        margin-bottom: 16px;
      }

      .ui-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fffdf8;
        font-family: var(--body);
        font-size: 32px;
        margin-bottom: 22px;
      }

      .ui-circle {
        width: 184px;
        height: 184px;
        margin: 0 auto 18px;
        border-radius: 999px;
        border: 1px solid rgba(140, 106, 53, 0.26);
        background:
          radial-gradient(circle at 36% 28%, rgba(255, 253, 248, 0.95) 0%, rgba(247, 232, 205, 0.9) 46%, rgba(231, 211, 177, 0.92) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ui-count {
        font-family: var(--display);
        font-size: 74px;
        line-height: 1;
      }

      .ui-helper {
        color: var(--muted);
        font-size: 24px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const line1 = "أحيانًا نحتاج مكانًا هادئًا";
      const line2 = "لنكتب ذكرًا فقط";
      const line3 = "بدون ضجيج";
      const line4 = "بدون استعجال";
      const finalLine = "بينك وبين الله";

      const el1 = document.getElementById("line-1");
      const el2 = document.getElementById("line-2");
      const el3 = document.getElementById("line-3");
      const el4 = document.getElementById("line-4");
      const elFinal = document.getElementById("final-line");

      const cursor1 = document.getElementById("cursor-1");
      const cursor2 = document.getElementById("cursor-2");
      const cursorFinal = document.getElementById("cursor-final");

      function typeLine(tl, text, element, cursor, start, step) {
        if (cursor) {
          tl.set(cursor, { opacity: 1 }, start);
        }
        let typed = "";
        Array.from(text).forEach((char, index) => {
          tl.call(() => {
            typed += char;
            element.textContent = typed;
          }, null, start + index * step);
        });
        if (cursor) {
          tl.to(cursor, { opacity: 0.18, duration: 0.28, repeat: 1, yoyo: true, ease: "none" }, start + text.length * step);
          tl.set(cursor, { opacity: 0 }, start + text.length * step + 0.62);
        }
      }

      const tl = gsap.timeline({ paused: true });

      tl.from(".text-stage", {
        opacity: 0,
        y: 10,
        duration: 0.9,
        ease: "sine.out"
      }, 0.18);

      typeLine(tl, line1, el1, cursor1, 1.2, 0.09);
      typeLine(tl, line2, el2, cursor2, 6.2, 0.085);

      tl.call(() => { el3.textContent = line3; }, null, 9.45);
      tl.from(".line-wrap--3", {
        opacity: 0,
        y: 8,
        duration: 0.45,
        ease: "power1.out"
      }, 9.45);

      tl.call(() => { el4.textContent = line4; }, null, 10.2);
      tl.from(".line-wrap--4", {
        opacity: 0,
        y: 8,
        duration: 0.45,
        ease: "power1.out"
      }, 10.2);

      tl.to(".text-stage", {
        opacity: 0.22,
        duration: 0.9,
        ease: "sine.inOut"
      }, 11.1);

      tl.fromTo(".ui-glimpse",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.8, ease: "sine.out" },
        11.3
      );

      tl.to(".ui-glimpse", {
        opacity: 0.18,
        duration: 0.8,
        ease: "sine.inOut"
      }, 13.7);

      typeLine(tl, finalLine, elFinal, cursorFinal, 14.2, 0.1);

      tl.to(".text-stage", {
        opacity: 0.1,
        duration: 1,
        ease: "none"
      }, 15.0);

      window.__timelines["quiet-text-story"] = tl;
    </script>
  </div>
</body>
</html>
