<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype - Tasbeeh Interaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div
    id="tasbeeh-prototype"
    data-composition-id="tasbeeh-prototype"
    data-start="0"
    data-duration="6.5"
    data-width="1080"
    data-height="1920"
  >
    <div class="scene">
      <div class="scene-content">
        <div class="phone-shell">
          <div class="app-frame">
            <div class="app-header">
              <p class="eyebrow">مساحة شخصية هادئة</p>
              <h1 class="title">مسبحتك الرقمية</h1>
            </div>

            <section class="tasbeeh-card" aria-label="التسبيح الرقمي">
              <h2 class="section-title">التسبيح الرقمي</h2>
              <p class="select-label">الذكر المختار</p>
              <div class="dhikr-pill" id="dhikr-pill">سبحان الله</div>

              <button class="tasbeeh-button" id="tasbeeh-button" type="button" aria-label="عد التسبيح">
                <span class="tasbeeh-button__content">
                  <span class="tasbeeh-label" id="tasbeeh-label">سبحان الله</span>
                  <span class="tasbeeh-count" id="tasbeeh-count">0</span>
                  <span class="tasbeeh-cta">سبّح الآن</span>
                </span>
              </button>

              <p class="helper-text">بدون مزامنة، بدون تتبع</p>
            </section>
          </div>
        </div>
      </div>
    </div>

    <style>
      :root {
        --color-bg: #f6f0e4;
        --color-surface: #fffaf1;
        --color-surface-soft: rgba(255, 250, 241, 0.94);
        --color-accent: #8c6a35;
        --color-accent-soft: rgba(140, 106, 53, 0.14);
        --color-gold: #c8a673;
        --color-border: #d6c6ab;
        --color-text-primary: #2f261b;
        --color-text-secondary: #5c4d3b;
        --color-text-muted: #8b7961;
        --shadow-soft: 0 12px 32px rgba(77, 55, 26, 0.08);
        --font-display: "Cairo", sans-serif;
        --font-body: "Noto Naskh Arabic", serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-bg);
      }

      #tasbeeh-prototype {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.55), transparent 22%),
          radial-gradient(circle at 78% 10%, rgba(200, 166, 115, 0.12), transparent 26%),
          linear-gradient(180deg, #f9f5eb 0%, #f2eadc 46%, #efe5d5 100%);
        color: var(--color-text-primary);
        font-family: var(--font-body);
      }

      .scene,
      .scene-content {
        width: 100%;
        height: 100%;
      }

      .scene-content {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 88px;
        box-sizing: border-box;
      }

      .phone-shell {
        width: 100%;
        max-width: 620px;
        border-radius: 54px;
        padding: 18px;
        background: rgba(255, 253, 248, 0.76);
        box-shadow:
          0 16px 40px rgba(77, 55, 26, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(214, 198, 171, 0.7);
      }

      .app-frame {
        min-height: 1260px;
        background:
          radial-gradient(circle at 50% 0%, rgba(200, 166, 115, 0.08), transparent 24%),
          var(--color-surface);
        border-radius: 40px;
        border: 1px solid rgba(214, 198, 171, 0.82);
        box-shadow: var(--shadow-soft);
        padding: 86px 42px 60px;
        box-sizing: border-box;
      }

      .app-header {
        text-align: center;
        margin-bottom: 42px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--color-text-muted);
        font-size: 28px;
      }

      .title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 66px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--color-text-primary);
      }

      .tasbeeh-card {
        background:
          radial-gradient(circle at 50% 2%, rgba(200, 166, 115, 0.18), transparent 38%),
          var(--color-surface-soft);
        border: 1px solid rgba(214, 198, 171, 0.86);
        border-radius: 34px;
        text-align: center;
        padding: 52px 30px 44px;
        box-shadow: 0 8px 22px rgba(77, 55, 26, 0.06);
      }

      .section-title {
        margin: 0 0 18px;
        font-family: var(--font-display);
        font-size: 46px;
        font-weight: 700;
        color: var(--color-text-primary);
      }

      .select-label {
        margin: 0 0 12px;
        font-size: 30px;
        color: var(--color-text-secondary);
      }

      .dhikr-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 260px;
        max-width: 100%;
        padding: 16px 28px;
        border-radius: 999px;
        background: #fffdf8;
        border: 1px solid var(--color-border);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        font-size: 34px;
        margin-bottom: 42px;
        box-shadow: 0 4px 12px rgba(77, 55, 26, 0.04);
      }

      .tasbeeh-button {
        width: 390px;
        aspect-ratio: 1;
        margin: 0 auto 24px;
        border: 1px solid rgba(140, 106, 53, 0.34);
        border-radius: 999px;
        background:
          radial-gradient(circle at 36% 28%, rgba(255, 253, 248, 0.95) 0%, rgba(247, 232, 205, 0.9) 46%, rgba(231, 211, 177, 0.92) 100%),
          linear-gradient(162deg, rgba(255, 250, 241, 0.55), rgba(215, 190, 147, 0.2));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.62),
          inset 0 -11px 20px rgba(120, 87, 45, 0.16),
          inset 0 11px 18px rgba(255, 255, 255, 0.24),
          0 8px 18px rgba(77, 55, 26, 0.1);
        color: var(--color-text-primary);
        padding: 0;
        position: relative;
      }

      .tasbeeh-button__content {
        height: 100%;
        width: 100%;
        padding: 56px 34px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .tasbeeh-label {
        color: var(--color-text-secondary);
        font-size: 34px;
      }

      .tasbeeh-count {
        display: inline-block;
        min-width: 3ch;
        text-align: center;
        font-family: var(--font-display);
        font-size: 124px;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
        color: var(--color-text-primary);
      }

      .tasbeeh-cta {
        font-family: var(--font-display);
        font-size: 30px;
        color: #594322;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(112, 84, 41, 0.24);
        border-radius: 999px;
        padding: 12px 24px;
        line-height: 1.15;
      }

      .helper-text {
        margin: 0;
        font-size: 28px;
        color: var(--color-text-muted);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const countEl = document.getElementById("tasbeeh-count");
      const buttonEl = document.getElementById("tasbeeh-button");

      tl.from(".phone-shell", {
        y: 20,
        opacity: 0,
        duration: 0.7,
        ease: "power2.out"
      }, 0.18);

      tl.from(".app-header", {
        y: 16,
        opacity: 0,
        duration: 0.55,
        ease: "sine.out"
      }, 0.42);

      tl.from(".tasbeeh-card", {
        y: 18,
        opacity: 0,
        duration: 0.65,
        ease: "power1.out"
      }, 0.58);

      tl.from(".dhikr-pill", {
        opacity: 0,
        duration: 0.4,
        ease: "power1.out"
      }, 0.92);

      tl.from(".tasbeeh-button", {
        scale: 0.985,
        opacity: 0,
        duration: 0.48,
        ease: "power2.out"
      }, 1.02);

      tl.from(".helper-text", {
        opacity: 0,
        duration: 0.35,
        ease: "none"
      }, 1.18);

      tl.to(buttonEl, {
        scale: 0.962,
        duration: 0.12,
        ease: "power1.out"
      }, 2.22);

      tl.call(() => {
        countEl.textContent = "1";
      }, null, 2.31);

      tl.to(countEl, {
        scale: 1.04,
        duration: 0.16,
        ease: "sine.out"
      }, 2.31);

      tl.to(buttonEl, {
        scale: 1,
        duration: 0.24,
        ease: "power2.out"
      }, 2.36);

      tl.to(countEl, {
        scale: 1,
        duration: 0.24,
        ease: "power2.out"
      }, 2.46);

      window.__timelines["tasbeeh-prototype"] = tl;
    </script>
  </div>
</body>
</html>
