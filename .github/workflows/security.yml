name: Security & Validation

on:
  push:
    branches: [main, open-source-preparation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './.netlify/*' | while read f; do
            node --check "$f" || exit 1
          done

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high

  lint-security:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          echo "Checking for dangerous patterns..."
          FAIL=0

          if grep -rn "eval(" --include="*.js" --exclude-dir=node_modules .; then
            echo "::warning::Found eval() usage"
            FAIL=1
          fi

          if grep -rn "document\.write" --include="*.js" --exclude-dir=node_modules .; then
            echo "::warning::Found document.write() usage"
            FAIL=1
          fi

          if grep -rn "localStorage.*[Kk]ey\|localStorage.*[Tt]oken\|localStorage.*[Ss]ecret" --include="*.js" --exclude-dir=node_modules .; then
            echo "::error::Found localStorage used with potential secrets"
            FAIL=1
          fi

          if grep -rn "console\.log.*[Aa]pi[Kk]ey\|console\.log.*[Ss]ecret\|console\.log.*[Tt]oken" --include="*.js" --exclude-dir=node_modules .; then
            echo "::error::Found console.log with potential secrets"
            FAIL=1
          fi

          if grep -rn "onclick=\|onsubmit=\|onload=" --include="*.html" .; then
            echo "::warning::Found inline event handlers"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "Review the findings above."
            exit 1
          fi

          echo "No blocked security patterns found."

  netlify-toml-validate:
    name: Netlify Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate netlify.toml
        run: |
          python3 - <<'PY'
          import sys
          try:
              import tomllib
          except ImportError:
              print("Python 3.11+ is required for TOML validation")
              sys.exit(1)

          with open("netlify.toml", "rb") as f:
              tomllib.load(f)

          content = open("netlify.toml", encoding="utf-8").read()

          if "unsafe-eval" in content:
              print("::error::CSP contains unsafe-eval")
              sys.exit(1)

          if "X-XSS-Protection" in content:
              print("::error::Deprecated X-XSS-Protection header found")
              sys.exit(1)

          print("netlify.toml syntax and security checks passed")
          PY
