name: Security & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './.netlify/*' | while read f; do
            node --check "$f" || exit 1
          done

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  lint-security:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          echo "Checking for dangerous patterns..."
          FAIL=0

          # Check for eval()
          if grep -rn "eval(" --include="*.js" --exclude-dir=node_modules .; then
            echo "::warning::Found eval() usage"
            FAIL=1
          fi

          # Check for document.write
          if grep -rn "document\.write" --include="*.js" --exclude-dir=node_modules .; then
            echo "::warning::Found document.write() usage"
            FAIL=1
          fi

          # Check for localStorage with secrets
          if grep -rn "localStorage.*[Kk]ey\|localStorage.*[Tt]oken\|localStorage.*[Ss]ecret" --include="*.js" --exclude-dir=node_modules .; then
            echo "::error::Found localStorage used with potential secrets"
            FAIL=1
          fi

          # Check for console.log with secrets
          if grep -rn "console\.log.*[Aa]pi[Kk]ey\|console\.log.*[Ss]ecret\|console\.log.*[Tt]oken" --include="*.js" --exclude-dir=node_modules .; then
            echo "::error::Found console.log with potential secrets"
            FAIL=1
          fi

          # Check for inline event handlers in HTML
          if grep -rn "onclick=\|onsubmit=\|onload=" --include="*.html" .; then
            echo "::warning::Found inline event handlers"
            FAIL=1
          fi

          if [ $FAIL -eq 0 ]; then
            echo "No dangerous patterns found."
          else
            echo "Review warnings above."
          fi
          exit 0

  netlify-toml-validate:
    name: Netlify Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate netlify.toml syntax
        run: |
          python3 -c "
          import sys
          # Basic TOML syntax check
          with open('netlify.toml', 'r') as f:
              content = f.read()
          # Check for common issues
          if 'unsafe-inline' in content:
              print('::warning::CSP contains unsafe-inline')
          if 'unsafe-eval' in content:
              print('::warning::CSP contains unsafe-eval')
          if 'X-XSS-Protection' in content:
              print('::error::Deprecated X-XSS-Protection header found')
              sys.exit(1)
          print('netlify.toml looks good')
          "
