name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests (zero dependencies, node:test)
        run: npm test

  lint:
    name: ESLint (errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint (errors fail the build; warnings allowed for legacy code)
        run: npm run lint

  lint-css:
    name: Stylelint (logical properties)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Lint CSS (physical properties fail the build)
        run: npm run lint:css
