name: CI

on:
  push:
    branches: [main, feat/vercel-migration, feat/runtime-neutral-backend]
  pull_request:
    branches: [main, feat/vercel-migration]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests (zero dependencies, node:test)
        run: npm test

  lint:
    name: ESLint (errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint (errors fail the build; warnings allowed for legacy code)
        run: npm run lint

  lint-css:
    name: Stylelint (logical properties)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint CSS (physical properties fail the build)
        run: npm run lint:css

  migration-guard:
    name: Migration Revoke Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Every migration function must revoke PUBLIC
        run: npm run guard:migrations
