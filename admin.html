<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>لوحة المراجعة | أجر لا ينقطع</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="admin.css?v=20260227">
    <style>
        .badge-new {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background-color: #e74c3c;
            border-radius: 50%;
            border: 2px solid white;
            display: inline-block;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Section -->
        <section id="login-section" class="login-section">
            <h2>🔐 تسجيل الدخول</h2>
            <div id="login-error" class="error-message hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="api-key">مفتاح API</label>
                    <div class="password-wrapper">
                        <input type="password" id="api-key" class="password-input" placeholder="أدخل مفتاح المسؤول"
                            required>
                        <button type="button" id="toggle-password" class="password-toggle"
                            aria-label="إظهار/إخفاء كلمة المرور">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">دخول</button>
            </form>
        </section>

        <!-- Admin Panel Section -->
        <section id="admin-section" class="hidden">
            <header>
                <h1>لوحة مراجعة المشاركات</h1>
                <p class="text-muted">أجر لا ينقطع</p>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="pending-count">-</div>
                        <div class="stat-label">في الانتظار</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="approved-count">-</div>
                        <div class="stat-label">مقبولة</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="rejected-count">-</div>
                        <div class="stat-label">مرفوضة</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="memory-pending-count">-</div>
                        <div class="stat-label">ذكريات معلقة</div>
                    </div>
                </div>
                <div class="mt-1" style="display:flex;gap:8px;flex-wrap:wrap;">
                    <a href="/analytics" class="btn" style="background:var(--color-accent);color:white;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:0.9rem;">📊 التحليلات</a>
                    <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
                </div>
            </header>

            <!-- Tab Navigation -->
            <div class="admin-tabs" style="display:flex;gap:8px;margin-bottom:16px;">
                <button class="btn btn-primary btn-sm admin-tab active" id="tab-submissions"
                    onclick="switchTab('submissions')">المشاركات</button>
                <button class="btn btn-ghost btn-sm admin-tab" id="tab-memories" onclick="switchTab('memories')">صفحات
                    الذكرى</button>
                <button class="btn btn-ghost btn-sm admin-tab" id="tab-feedback" style="position:relative;"
                    onclick="switchTab('feedback')">
                    الرسائل
                    <span id="feedback-badge" class="badge-new hidden"></span>
                </button>
            </div>

            <!-- Submissions Tab -->
            <div id="submissions-tab">
                <button class="btn refresh-btn" onclick="loadPending()">🔄 تحديث القائمة</button>

                <div id="notification" class="hidden"></div>

                <div id="loading" class="loading">جاري التحميل...</div>

                <div id="submissions-list" class="submissions-list hidden"></div>

                <div id="empty-state" class="empty-state hidden">
                    <p>✅ لا توجد مشاركات في الانتظار</p>
                </div>
            </div>

            <!-- Memories Tab -->
            <div id="memories-tab" class="hidden">
                <button class="btn refresh-btn" onclick="loadPendingMemories()">🔄 تحديث قائمة الذكريات</button>

                <div id="memory-notification" class="hidden"></div>

                <div id="memory-loading" class="loading hidden">جاري التحميل...</div>

                <div id="memories-list" class="submissions-list hidden"></div>

                <div id="memory-empty-state" class="empty-state hidden">
                    <p>✅ لا توجد صفحات ذكرى في الانتظار</p>
                </div>
            </div>

            <!-- Feedback Tab -->
            <div id="feedback-tab" class="hidden">
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
                    <select id="feedback-filter" class="form-select"
                        style="width:auto;min-width:140px;padding:8px 12px;font-size:0.85rem;border-radius:8px;"
                        onchange="loadFeedback()">
                        <option value="">الكل</option>
                        <option value="New" selected>جديدة</option>
                        <option value="In Progress">قيد المعالجة</option>
                        <option value="Resolved">تم الحل</option>
                        <option value="Archived">مؤرشفة</option>
                    </select>
                    <button class="btn refresh-btn" onclick="loadFeedback()">🔄 تحديث</button>
                    <span id="feedback-total"
                        style="font-size:0.8rem;color:var(--color-text-muted);margin-right:auto;"></span>
                </div>

                <div id="feedback-loading" class="loading hidden">جاري التحميل...</div>

                <div id="feedback-list" class="submissions-list hidden"></div>

                <div id="feedback-empty-state" class="empty-state hidden">
                    <p>📭 لا توجد رسائل حالياً</p>
                </div>
            </div>

            <!-- Toast Notification -->
            <div id="feedback-toast"
                style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#27ae60;color:white;padding:10px 24px;border-radius:999px;font-size:0.9rem;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2);transition:opacity 0.3s ease;">
                تم تحديث الحالة بنجاح
            </div>
        </section>
    </div>

    <script src="lib/analytics.js?v=20260521"></script>
    <script src="admin.js?v=20260227"></script>
</body>

</html>
