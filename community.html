<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساهمات المجتمع | أجر لا ينقطع</title>
    <meta name="description" content="تصفح المساهمات المعتمدة من المجتمع: أذكار، أدعية، آيات وأحاديث.">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="community-body">
    <main class="community-page container" aria-live="polite">
        <header class="community-header">
            <h1>مساهمات المجتمع</h1>
            <p>هنا تُعرض المشاركات التي تم اعتمادها فقط، بنية نشر الخير والأجر.</p>
            <div class="community-stats">
                <p id="approvedCount">🤍 ... مشاركة معتمدة</p>
                <p id="totalSharesCount">📿 ... مرة تم نشر الأذكار</p>
            </div>
        </header>

        <section class="featured" id="featuredSection" hidden>
            <h2>الأكثر مشاركة 🕊</h2>
            <article class="submission-card submission-card--featured" id="featuredCard"></article>
        </section>

        <section class="community-controls" aria-label="خيارات الفلترة والترتيب">
            <div class="tabs" id="filterTabs">
                <button class="tab is-active" data-type="all">الكل</button>
                <button class="tab" data-type="dhikr">ذكر</button>
                <button class="tab" data-type="dua">دعاء</button>
                <button class="tab" data-type="ayah">آية</button>
                <button class="tab" data-type="hadith">حديث</button>
            </div>

            <label class="sort-wrap" for="sortSelect">
                ترتيب:
                <select id="sortSelect">
                    <option value="latest">الأحدث</option>
                    <option value="most_shared">الأكثر مشاركة</option>
                </select>
            </label>
        </section>

        <section id="stateMessage" class="state-message">جارٍ تحميل المشاركات...</section>
        <section id="submissionsContainer" class="submissions-grid"></section>

        <nav class="pagination" id="pagination" hidden>
            <button id="prevPage">السابق</button>
            <span id="pageInfo"></span>
            <button id="nextPage">التالي</button>
        </nav>

        <aside class="mobile-stats-bar" id="mobileStatsBar" hidden>
            <span id="mobileApprovedCount">🤍 ... مشاركة</span>
            <a href="/index.html#form" class="btn btn--primary mobile-stats-bar__cta">أضف ذكرك</a>
        </aside>

        <div class="toast" id="shareToast" role="status" aria-live="polite" hidden>تم النسخ 🤍</div>
    </main>

    <script src="community.js"></script>
</body>

</html>
