# Netlify Configuration for أجر لا ينقطع
# Full-stack serverless deployment

[build]
  # No build command needed - pure static files + serverless functions
  command = ""
  publish = "/"
  functions = "netlify/functions"

# ═══════════════════════════════════════════════════════════════════════════
# Functions Configuration
# ═══════════════════════════════════════════════════════════════════════════
[functions]
  # Use ES modules
  node_bundler = "esbuild"
  # Include shared utilities
  included_files = ["netlify/functions/utils/**"]

# ═══════════════════════════════════════════════════════════════════════════
# Redirects - API routes to functions
# ═══════════════════════════════════════════════════════════════════════════

# Public API
[[redirects]]
  from = "/api/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Admin API
[[redirects]]
  from = "/api/admin/pending"
  to = "/.netlify/functions/admin-pending"
  status = 200

[[redirects]]
  from = "/api/admin/approve"
  to = "/.netlify/functions/admin-approve"
  status = 200

[[redirects]]
  from = "/api/admin/reject"
  to = "/.netlify/functions/admin-reject"
  status = 200

[[redirects]]
  from = "/api/admin/stats"
  to = "/.netlify/functions/admin-stats"
  status = 200

# Clean URLs for pages
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ═══════════════════════════════════════════════════════════════════════════
# Security Headers - Applied to all pages
# ═══════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co;"

# ═══════════════════════════════════════════════════════════════════════════
# Cache Control
# ═══════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
