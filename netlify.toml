# ═══════════════════════════════════════════════════════════════════════════
# Security Headers - Applied to all pages
# ═══════════════════════════════════════════════════════════════════════════
# CSP directives:
#   default-src 'self'           — all resources default to same origin
#   script-src 'self' cdn.jsdelivr.net www.googletagmanager.com — our JS + Chart.js + GA4 gtag.js
#   style-src 'self' fonts.googleapis.com — our CSS + Google Fonts stylesheet
#   font-src 'self' fonts.gstatic.com — Google Fonts webfonts
#   img-src 'self' data: www.google-analytics.com — images + GA4 tracking pixel
#   connect-src 'self' *.supabase.co data.techforpalestine.org www.google-analytics.com *.google-analytics.com — API calls + GA4 collection
#   object-src 'none'            — no Flash/Java/object embeddings
#   frame-ancestors 'none'       — no embedding in iframes (redundant with X-Frame-Options)
#   base-uri 'self'              — <base> tag restricted to same origin
#   form-action 'self'           — forms can only submit to same origin
#   upgrade-insecure-requests    — auto-upgrade http:// to https://
# ═══════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' https://*.supabase.co https://data.techforpalestine.org https://www.google-analytics.com https://*.google-analytics.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ═══════════════════════════════════════════════════════════════════════════
# Cache Control
# Fixes:
#   - Removed immutable from non-fingerprinted .css/.js files (P-3)
#   - Use reasonable max-age for static assets without content hashing
# ═══════════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted / versioned assets (fonts) can be long-cached
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must never be cached or updates get stuck behind old copies
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
