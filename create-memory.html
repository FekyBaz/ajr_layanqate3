<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء صفحة صدقة جارية | أجر لا ينقطع</title>
    <meta name="description" content="أنشئ صفحة صدقة جارية على روح متوفى — أجر لا ينقطع">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/memory.css">
</head>

<body>
    <main class="create-memory-page">
        <div class="create-memory-form-card">
            <div class="memory-ornament" aria-hidden="true" style="text-align:center;">﷽</div>
            <h1 class="create-memory-title">إنشاء صفحة صدقة جارية</h1>

            <form id="create-memory-form" novalidate>
                <div class="form-group">
                    <label for="deceased-name">اسم المتوفى / المتوفاة *</label>
                    <input type="text" id="deceased-name" maxlength="100" required placeholder="مثال: أحمد بن محمد"
                        autocomplete="off">
                    <div class="char-count" id="name-char-count">0 / 100</div>
                    <div class="field-error" id="name-error"></div>
                </div>

                <div class="form-group">
                    <label for="relation">صلة القرابة (اختياري)</label>
                    <input type="text" id="relation" maxlength="50" placeholder="مثال: والدي، جدتي، صديقي"
                        autocomplete="off">
                    <div class="form-hint">سيظهر في الصفحة بجانب الاسم</div>
                </div>

                <div class="form-group">
                    <label for="memory-message">رسالة / دعاء *</label>
                    <textarea id="memory-message" maxlength="1000" required
                        placeholder="اكتب رسالة أو دعاء للمتوفى..."></textarea>
                    <div class="char-count" id="message-char-count">0 / 1000</div>
                    <div class="field-error" id="message-error"></div>
                </div>

                <button type="submit" class="create-memory-submit" id="submit-btn">
                    إنشاء صفحة صدقة جارية
                </button>

                <div class="form-status" id="form-status"></div>
            </form>
        </div>

        <a href="/" class="back-link">← العودة للرئيسية</a>
    </main>

    <script src="/create-memory.js"></script>
</body>

</html>
